services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gorixpay
      POSTGRES_USER: gorixpay
      # 密码从 deploy/.env 读，PSQL 与下面的 DSN 用同一个变量，改一处就够
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 里设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorixpay -d gorixpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gorixpay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The payment process has background workers; give them time to finish the
    # notification in flight before the container is killed.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      GORIXPAY_ENVIRONMENT: production
      GORIXPAY_HTTP_ADDRESS: :8080
      GORIXPAY_PUBLIC_URL: ${GORIXPAY_PUBLIC_URL:-http://localhost:8080}
      GORIXPAY_DATABASE_DRIVER: postgres
      GORIXPAY_DATABASE_DSN: host=postgres user=gorixpay password=${POSTGRES_PASSWORD} dbname=gorixpay port=5432 sslmode=disable
      GORIXPAY_MASTER_KEY_FILE: /run/secrets/master_key
      GORIXPAY_REDIS_ADDR: redis:6379
      GORIXPAY_REDIS_PREFIX: "gorixpay:"
      GORIXPAY_SANDBOX_ENABLED: "false"
    secrets:
      - master_key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

secrets:
  # 文件内容：32 字节随机数，或这 32 字节的 base64（internal/platform/secret.LoadKeyFile 两种都认）
  master_key:
    file: ./secrets/master_key.txt
