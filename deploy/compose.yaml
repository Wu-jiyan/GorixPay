services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gorixpay
      POSTGRES_USER: gorixpay
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorixpay -d gorixpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gorixpay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GORIXPAY_ENVIRONMENT: production
      GORIXPAY_HTTP_ADDRESS: :8080
      GORIXPAY_PUBLIC_URL: http://localhost:8080
      GORIXPAY_DATABASE_DRIVER: postgres
      GORIXPAY_DATABASE_DSN: host=postgres user=gorixpay password=gorixpay dbname=gorixpay port=5432 sslmode=disable
      GORIXPAY_MASTER_KEY_FILE: /run/secrets/master_key
    secrets:
      - master_key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  master_key:
    file: ./secrets/master_key.txt
