name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Go 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          # 一致性测试会起 PHP 跑上游函数做签名 oracle，缺 openssl 会直接失败
          php-version: '8.3'
          extensions: openssl, curl, mbstring
          coverage: none

      # 格式检查：只检查 git 跟踪的 Go 文件（上游 PHP 源码不在仓库里）；
      # 用 git ls-files 而不是 gofmt -l .，gofmt 自己失败时这一步会直接红，不会静默放行
      - name: 检查 gofmt
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "${unformatted}" ]; then
            echo "以下文件未格式化："
            echo "${unformatted}"
            exit 1
          fi

      # 编译：防止包级编译错误进入主干
      - name: 编译
        run: go build ./...

      # 静态检查：防止 printf 参数不匹配、锁值拷贝一类的问题进入主干
      - name: 静态检查
        run: go vet ./...

      # 测试：防止行为回归，关闭缓存保证每轮都真跑；
      # 机器上有 php 时，tests/conformance/epay 会连上游 SDK 一起跑，没有则自动跳过 oracle 部分
      - name: 测试
        run: go test ./... -count=1

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 依赖安装：仓库已提交 package-lock.json，用 npm ci 装锁定版本，避免依赖漂移
      - name: 安装依赖
        run: npm ci

      # 前端构建：防止类型错误和坏页面进入主干
      - name: 构建
        run: npm run build
